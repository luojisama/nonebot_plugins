<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 10px;
            background-color: transparent;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 650px;
            width: 500px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #ffb6c1; /* 浅粉红边框 */
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.3);
            width: 440px;
            position: relative;
            overflow: hidden;
            margin: 10px auto;
        }

        .card::before {
            content: '🌸';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 50px;
            opacity: 0.2;
        }

        .card::after {
            content: '✨';
            position: absolute;
            bottom: -10px;
            left: -10px;
            font-size: 50px;
            opacity: 0.2;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .title {
            color: #ff69b4; /* 热粉红 */
            font-size: 28px;
            font-weight: bold;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #fff5f8;
            border-radius: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffb6c1;
            margin-right: 15px;
            object-fit: cover;
        }

        .user-name {
            font-size: 20px;
            color: #d147a3;
            font-weight: bold;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: space-between;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ffe4e1;
            text-align: center;
            flex: 1 1 calc(50% - 10px);
            min-width: 120px;
            box-sizing: border-box;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            color: #ff69b4;
            font-weight: bold;
        }

        .level-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 5px;
        }

        .hitokoto-box {
            border-top: 2px dashed #ffb6c1;
            padding-top: 20px;
            font-style: italic;
            color: #666;
            line-height: 1.6;
            position: relative;
        }

        .hitokoto-text {
            font-size: 16px;
            margin-bottom: 8px;
            color: #555;
        }

        .hitokoto-from {
            font-size: 14px;
            text-align: right;
            color: #ffb6c1;
        }

        .footer-time {
            text-align: center;
            font-size: 12px;
            color: #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1 class="title">{title}</h1>
        </div>
        
        <div class="user-info">
            <img class="user-avatar" src="{avatar_url}" alt="avatar">
            <div class="user-name">{user_name}</div>
        </div>

        <div class="stats">
            <div class="stat-item" style="display: {inc_display};">
                <div class="stat-label">本次增加</div>
                <div class="stat-value">+{inc}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">当前好感度</div>
                <div class="stat-value">{new_favorability}</div>
                <div class="level-badge">{level_name}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">行动值</div>
                <div class="stat-value">{action_points}</div>
                <div class="level-badge">{ap_status}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">剩余打工</div>
                <div class="stat-value">{remaining_works}</div>
                <div class="level-badge">{work_status}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">商店金币</div>
                <div class="stat-value">{coins}</div>
                <div class="level-badge">{coin_level_name}</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">累计签到</div>
                <div class="stat-value">{total_sign_ins} 天</div>
                <div class="level-badge">坚持不懈</div>
            </div>
        </div>

        <div class="hitokoto-box">
            <div class="hitokoto-text">“{hitokoto_text}”</div>
            <div class="hitokoto-from">—— {hitokoto_from}</div>
        </div>

        <div class="footer-time">
            首次签到: {first_sign_in} | {time_label}: {sign_time}
        </div>
    </div>
</body>
</html>
